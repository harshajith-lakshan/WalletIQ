name: walletiq
description: Smart money management powered by intelligence.
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.13.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # === STATE MANAGEMENT & ARCHITECTURE ===
  provider: ^6.1.0
  get_it: ^7.6.0
  freezed_annotation: ^2.4.1

  # === FIREBASE ===
  firebase_core: ^2.24.0
  firebase_auth: ^4.15.0
  cloud_firestore: ^4.14.0
  firebase_storage: ^11.6.0
  firebase_messaging: ^14.7.0
  firebase_analytics: ^10.7.0
  firebase_crashlytics: ^11.7.0

  # === LOCAL DATABASE ===
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # === UI & COMPONENTS ===
  flutter_svg: ^2.0.10
  cached_network_image: ^3.3.1
  fl_chart: ^0.64.0
  intl: ^0.19.0

  # === LOCALIZATION ===
  easy_localization: ^3.0.2

  # === UTILITIES ===
  uuid: ^4.0.0
  dio: ^5.3.0

  # === PDF GENERATION ===
  pdf: ^3.10.6
  printing: ^5.11.0

  # === PLATFORM SPECIFIC ===
  flutter_local_notifications: ^16.0.1
  local_auth: ^2.2.0
  share_plus: ^7.2.1
  image_picker: ^1.0.4

  # === CONNECTIVITY ===
  connectivity_plus: ^5.0.1

  # === SECURE STORAGE ===
  flutter_secure_storage: ^9.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # === LINTING ===
  flutter_lints: ^3.0.1

  # === CODE GENERATION ===
  build_runner: ^2.4.6
  freezed: ^2.4.1
  hive_generator: ^2.0.1

  # === TESTING ===
  mockito: ^5.4.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  # === ASSETS ===
  assets:
    - assets/images/
    - assets/icons/
    - assets/logos/

  # === FONTS ===
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
